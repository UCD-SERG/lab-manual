on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

# Serialize deploys so two quick merges to main cannot publish out of order
# (#559). Queue rather than cancel, so a run mid-deploy always finishes;
# GitHub keeps only the newest pending run, so the latest main wins.
# preview.yml deliberately stays out of this group. A shared group keeps one
# pending run across both workflows, so a preview could cancel a queued main
# publish. The two cannot overwrite each other anyway: publish skips
# pr-preview/ (clean-exclude) and each preview writes only pr-preview/pr-<N>/,
# both through github-pages-deploy-action with force: false.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jags libcurl4-openssl-dev libpng-dev libfontconfig1-dev libjpeg-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev libwebp-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/
          clean-exclude: pr-preview/
          force: false
